name: CI

on:
  push:
    branches: [master]
  pull_request:

# The module is read-only in CI: a step must never silently rewrite
# go.mod / go.sum (e.g. by resolving a missing requirement).
env:
  GOFLAGS: -mod=readonly

jobs:
  test:
    name: Build, vet, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Lint (staticcheck)
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          "$(go env GOPATH)/bin/staticcheck" ./...

      - name: Test (race detector)
        run: go test -race -count=1 ./...
